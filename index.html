<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decibéis do Salão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: uma coluna estreita; um bloco por lado do salão, autosave com reserva; registros embaixo */
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --fg:#0a0a0a; --muted:#4a5568; --line:#d5dbe5;
  --accent:#1556d6; --accent-fg:#ffffff; --soft:#e8f0fe; --err:#c62828;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0d0d0f; --fg:#ffffff; --muted:#a3acbb; --line:#2a2f3a;
  --accent:#4d8dff; --accent-fg:#000000; --soft:#0f1d3a; --err:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0d0d0f; --fg:#ffffff; --muted:#a3acbb; --line:#2a2f3a;
  --accent:#4d8dff; --accent-fg:#000000; --soft:#0f1d3a; --err:#ff6b6b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header h1{font-size:1.6rem;margin:0;text-wrap:balance;color:var(--accent)}
header p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.when{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.when div{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=date],input[type=time],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
/* grade de medições */
.grp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp h3{margin:0;font-size:.85rem;font-weight:700;padding:8px 12px;background:var(--soft)}
.grid{display:grid;grid-template-columns:3.2rem repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px;align-items:center}
.grid .hd{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:center}
.grid .pt{font-family:var(--f-num);font-size:.85rem;color:var(--muted)}
.grid input{font-family:var(--f-num);font-size:1.15rem;font-weight:700;width:100%;min-width:0;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center}
.grid input:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.grid input.calc{background:var(--soft);border-style:dashed;color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:360px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sum b{font-family:var(--f-num);font-size:1.25rem}
.sum .geral{background:var(--soft);border-color:transparent}
tr.tot td{font-weight:700;color:var(--fg)}
tr.tot td:first-child{color:var(--fg)}
.grid input.bad{border-color:var(--err);outline:2px solid var(--err);outline-offset:1px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:13px 16px;border:1px solid transparent;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg)}
.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.confirm{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.msg{font-size:.9rem;margin:0;min-height:1.2em}
.msg.err{color:var(--err)} .msg.ok{color:var(--accent)}
h2{font-size:1.1rem;margin:0}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* tabela de um registro */
.rec{display:flex;flex-direction:column;gap:6px}
.rec+.rec{border-top:1px solid var(--line);padding-top:14px}
.rec h4{margin:0;font-size:.95rem}
.rechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act span{font-size:.85rem}
.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.danger{background:transparent;color:var(--err);border-color:var(--err)}
.dangerfill{background:var(--err);color:var(--accent-fg)}
.rec h4 span{color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;text-align:right;font-family:var(--f-num);font-size:.88rem}
td:first-child{font-family:var(--f-body);color:var(--muted);font-size:.85rem}
tr.sep td{border-top:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:18px 6px;margin:0}
.lock{font-size:.82rem;color:var(--muted)}
.export{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.export div{display:flex;flex-direction:column;gap:4px;min-width:0}
.status{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 12px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.status.ok i{background:var(--accent)} .status.busy i{background:var(--muted)} .status.warn i{background:var(--err)}
.status.warn{color:var(--err)}
@media (prefers-reduced-motion:no-preference){.status.busy i{animation:pulse 1s infinite alternate}}
@keyframes pulse{to{opacity:.3}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Decibéis do Salão</h1>
  </header>

  <form class="card" id="form" novalidate>
    <div class="status" id="status"><i></i><span id="stxt">Comece a digitar. Tudo é guardado enquanto você anota.</span></div>
    <div class="when">
      <div><label class="lbl" for="dt">Data</label><input type="date" id="dt"></div>
      <div><label class="lbl" for="hr">Hora</label><input type="time" id="hr"></div>
    </div>
    <div id="groups"></div>
    <div>
      <span class="lbl">Médias calculadas</span>
      <div class="sum" id="sum" style="margin-top:6px">
        <div><span>Esquerdo</span><b id="s_esq">—</b></div>
        <div><span>Direito</span><b id="s_dir">—</b></div>
        <div><span>Meio</span><b id="s_mei">—</b></div>
        <div class="geral"><span>Geral</span><b id="s_ger">—</b></div>
      </div>
    </div>
    <button class="btn primary" type="button" id="save">Salvar medição</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section class="card">
    <div class="listhead">
      <h2>Registros</h2>
      <span class="lock" id="count"></span>
    </div>
    <div id="list"><p class="empty">Carregando registros…</p></div>
    <div class="export">
      <div><label class="lbl" for="mes">Período do PDF</label>
        <select id="mes"><option value="">Todos os registros</option></select></div>
      <button class="btn primary" type="button" id="pdf">Exportar PDF</button>
    </div>
    <p class="msg" id="pdfmsg" role="status"></p>
    <p class="lock" id="where"></p>
  </section>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const KEY = "decibeis-salao:v2";             // registros (principal, versão do GitHub)
  const KEY_RESERVA = "decibeis-salao:reserva"; // cópia de reserva completa
  const KEY_ATUAL = "decibeis-salao:atual";     // medição em andamento neste aparelho
  const INSIDE_CLAUDE = !!(window.claude && window.claude.use);
  const FECHA_PARADO_MS = 30*60*1000;
  const PONTOS = [
    {id:"e1",lado:"Lado esquerdo",nome:"1ª"},{id:"e2",lado:"Lado esquerdo",nome:"2ª"},{id:"e3",lado:"Lado esquerdo",nome:"3ª"},
    {id:"d1",lado:"Lado direito",nome:"1ª"},{id:"d2",lado:"Lado direito",nome:"2ª"},{id:"d3",lado:"Lado direito",nome:"3ª"},
    {id:"m",lado:"Meio, ao fundo",nome:"—"}
  ];
  const CAMPOS = [{k:"min",t:"Mín."},{k:"max",t:"Máx."},{k:"med",t:"Média"}];
  let store = null, records = [], atual = null, lastInput = 0, saveTimer = null, saving = Promise.resolve();

  /* ---------- formulário ---------- */
  (function build(){
    const box=$("groups"),lados=[...new Set(PONTOS.map(p=>p.lado))];
    box.style.cssText="display:flex;flex-direction:column;gap:12px";
    for(const lado of lados){
      const g=el("div",{className:"grp"},[el("h3",{textContent:lado})]);
      const grid=el("div",{className:"grid"},[el("span",{className:"hd"})].concat(CAMPOS.map(c=>el("span",{className:"hd",textContent:c.t}))));
      for(const p of PONTOS.filter(p=>p.lado===lado)){
        grid.appendChild(el("span",{className:"pt",textContent:p.nome==="—"?"":p.nome}));
        for(const c of CAMPOS){
          const i=el("input",{id:p.id+"_"+c.k,inputMode:"decimal",autocomplete:"off",placeholder:"—"});
          i.setAttribute("aria-label",lado+(p.nome==="—"?"":", "+p.nome+" medição")+", "+c.t);
          if(c.k==="med"){i.readOnly=true;i.tabIndex=-1;i.className="calc";i.placeholder="auto"}
          grid.appendChild(i);
        }
      }
      g.appendChild(grid);box.appendChild(g);
    }
  })();

  function el(tag,props,kids){const e=Object.assign(document.createElement(tag),props||{});(kids||[]).forEach(k=>e.appendChild(k));return e}
  function pad(n){return String(n).padStart(2,"0")}
  function nowParts(d){d=d||new Date();return {data:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),hora:pad(d.getHours())+":"+pad(d.getMinutes())}}
  function setNow(){const n=nowParts();$("dt").value=n.data;$("hr").value=n.hora}
  function hhmmss(d){return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
  function parseDb(v){v=String(v).trim();if(v==="")return "";const n=Number(v.replace(",","."));return isFinite(n)?n:v}
  function fmt(n){if(n===""||n==null)return "—";if(typeof n==="number")return String(n).replace(".",",");return String(n)}
  function fmtDate(iso){const [y,m,d]=String(iso).split("-");return d+"/"+m+"/"+y}
  function msg(e,t,cls){e.textContent=t;e.className="msg"+(cls?" "+cls:"")}
  function valid(r){return r&&typeof r.data==="string"&&r.pontos&&PONTOS.every(p=>r.pontos[p.id]&&typeof r.pontos[p.id]==="object")}
  function r1(n){return Math.round(n*10)/10}
  function avg(a){a=a.filter(v=>typeof v==="number");return a.length?r1(a.reduce((x,y)=>x+y,0)/a.length):""}
  function media(o){return (typeof o.min==="number"&&typeof o.max==="number")?r1((o.min+o.max)/2):""}
  // média de cada lado (esquerdo, direito, meio) e geral = média dessas três médias
  function resumo(pontos){
    const m=id=>pontos[id]&&pontos[id].med;
    const esquerdo=avg(["e1","e2","e3"].map(m)),direito=avg(["d1","d2","d3"].map(m)),meio=avg([m("m")]);
    return {esquerdo,direito,meio,geral:avg([esquerdo,direito,meio])};
  }
  function readForm(){
    const pontos={};
    for(const p of PONTOS){const o={min:parseDb($(p.id+"_min").value),max:parseDb($(p.id+"_max").value)};o.med=media(o);pontos[p.id]=o}
    return pontos;
  }
  function filled(pontos){return PONTOS.reduce((n,p)=>n+["min","max"].filter(k=>pontos[p.id][k]!=="").length,0)}
  function hasAny(pontos){return PONTOS.some(p=>pontos[p.id].min!==""||pontos[p.id].max!=="")}
  function live(){
    const pontos=readForm();
    for(const p of PONTOS) $(p.id+"_med").value=pontos[p.id].med===""?"":fmt(pontos[p.id].med);
    const s=resumo(pontos);$("s_esq").textContent=fmt(s.esquerdo);$("s_dir").textContent=fmt(s.direito);$("s_mei").textContent=fmt(s.meio);$("s_ger").textContent=fmt(s.geral);
    return pontos;
  }
  function fillForm(r){
    for(const p of PONTOS)for(const k of ["min","max"]){const v=r.pontos[p.id][k];$(p.id+"_"+k).value=v===""?"":fmt(v)}
    $("dt").value=r.data;$("hr").value=r.hora;live();
  }
  function clearForm(){for(const p of PONTOS)for(const k of ["min","max","med"])$(p.id+"_"+k).value="";setNow();live()}
  function sortKey(r){return r.data+" "+r.hora+" "+(r.salvoEm||"")}
  function status(state,t){$("status").className="status "+(state||"");$("stxt").textContent=t}

  /* registros da versão antiga (um valor por ponto): o valor vai na coluna Média */
  function fromLegacy(r){
    if(!r||typeof r.data!=="string"||!Array.isArray(r.esquerdo)||!Array.isArray(r.direito))return null;
    const v=x=>(x===undefined||x===null)?"":x,pontos={};
    ["e1","e2","e3"].forEach((id,i)=>pontos[id]={min:"",max:"",med:v(r.esquerdo[i])});
    ["d1","d2","d3"].forEach((id,i)=>pontos[id]={min:"",max:"",med:v(r.direito[i])});
    pontos.m={min:"",max:"",med:v(r.meio)};
    return {id:"legado-"+(r._doc||r.salvoEm||r.hora),_doc:r._doc,_raw:r,data:r.data,hora:r.hora||"",pontos,salvoEm:r.salvoEm,legado:true,fechado:true};
  }

  /* ---------- reserva: cópia de tudo neste aparelho (localStorage + IndexedDB) ---------- */
  const reserva = {
    _db:null,
    open(){if(this._db)return this._db;this._db=new Promise(res=>{try{const q=indexedDB.open("decibeis-salao-reserva",1);
      q.onupgradeneeded=()=>q.result.createObjectStore("registros",{keyPath:"id"});q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});return this._db},
    async put(rec){
      try{const all=JSON.parse(localStorage.getItem(KEY_RESERVA)||"{}");all[rec.id]=rec;localStorage.setItem(KEY_RESERVA,JSON.stringify(all))}catch(e){}
      try{const db=await this.open();if(db)db.transaction("registros","readwrite").objectStore("registros").put(rec)}catch(e){}
    },
    async all(){
      const out={};
      try{Object.assign(out,JSON.parse(localStorage.getItem(KEY_RESERVA)||"{}"))}catch(e){}
      try{const db=await this.open();if(db)await new Promise(res=>{const q=db.transaction("registros").objectStore("registros").getAll();q.onsuccess=()=>{(q.result||[]).forEach(r=>{if(!out[r.id])out[r.id]=r});res()};q.onerror=res})}catch(e){}
      return Object.values(out).filter(valid);
    }
  };

  /* ---------- armazenamento principal: banco do Claude quando aberto lá, senão o navegador ---------- */
  const localStore = {
    kind:"local",
    read(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v.filter(valid):[]}catch(e){return []}},
    legacy(){try{const v=JSON.parse(localStorage.getItem("decibeis-salao:medicoes")||"[]");return Array.isArray(v)?v.map(fromLegacy).filter(Boolean):[]}catch(e){return []}},
    async put(rec){
      const all=this.read();rec.id=rec.id||("r"+Date.parse(rec.salvoEm||new Date()));
      const i=all.findIndex(r=>r.id===rec.id);if(i>=0)all[i]=rec;else all.push(rec);
      localStorage.setItem(KEY,JSON.stringify(all));records=all.concat(this.legacy());render();
    },
    async remove(rec){
      if(rec.legado){
        const v=JSON.parse(localStorage.getItem("decibeis-salao:medicoes")||"[]");
        localStorage.setItem("decibeis-salao:medicoes",JSON.stringify(v.filter(x=>!(x.data===rec.data&&x.hora===rec.hora&&x.salvoEm===rec.salvoEm))));
      }else localStorage.setItem(KEY,JSON.stringify(this.read().filter(r=>r.id!==rec.id)));
      records=this.read().concat(this.legacy());render();
    },
    async start(){
      let main=this.read();
      // se o principal sumiu, recupera da reserva
      const res=await reserva.all(),ids=new Set(main.map(r=>r.id));
      const faltando=res.filter(r=>!r.apagado&&!ids.has(r.id));
      if(faltando.length){main=main.concat(faltando);try{localStorage.setItem(KEY,JSON.stringify(main))}catch(e){}}
      records=main.concat(this.legacy());render();resume();
    }
  };
  function claudeStore(db){return {
    kind:"claude",
    async put(rec){await db.collection("registros").doc(rec.id).set(rec)},
    async remove(rec){
      if(rec.legado){if(rec._doc)await db.collection("medicoes").doc(rec._doc).delete()}
      else await db.collection("registros").doc(rec.id).delete();
    },
    start(){
      const timer=setTimeout(()=>emptyList("Não foi possível carregar. Verifique a conexão e abra a página de novo."),10000);
      let novos=[],antigos=[],first=true;
      const join=()=>{records=novos.concat(antigos);render();if(first){first=false;resume()}};
      db.collection("registros").onSnapshot(snap=>{clearTimeout(timer);novos=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id})).filter(valid);join()},
        ()=>{clearTimeout(timer);emptyList("Erro ao carregar os registros. Recarregue a página.")});
      db.collection("medicoes").onSnapshot(snap=>{antigos=snap.docs.map(d=>fromLegacy(Object.assign({},d.data(),{_doc:d.id}))).filter(Boolean);if(!first)join()},()=>{});
    }
  }}
  function emptyList(t){$("list").textContent="";$("list").appendChild(el("p",{className:"empty",textContent:t}))}

  /* ---------- autosave ---------- */
  function persist(){
    if(!atual)return;
    const rec=JSON.parse(JSON.stringify(atual));
    reserva.put(rec);                                    // reserva primeiro, sempre
    try{localStorage.setItem(KEY_ATUAL,JSON.stringify(rec))}catch(e){}
    if(!store){status("warn","Guardado na reserva do aparelho. Conectando…");return}
    status("busy","Salvando…");
    saving=saving.then(()=>store.put(rec)).then(
      ()=>status("ok",(rec.fechado?"Medição concluída e salva às ":"Salvo automaticamente às ")+hhmmss(new Date())),
      ()=>status("warn","Sem conexão agora. Os valores estão na reserva do aparelho e serão enviados na próxima alteração."));
  }
  function onEdit(){
    lastInput=Date.now();
    const pontos=live();
    if(!atual){
      if(!hasAny(pontos))return;
      const n=nowParts(),agora=new Date().toISOString();
      if($("dt").dataset.touched!=="1")$("dt").value=n.data;
      if($("hr").dataset.touched!=="1")$("hr").value=n.hora;
      atual={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),criadoEm:agora,fechado:false};
    }
    Object.assign(atual,{data:$("dt").value||nowParts().data,hora:$("hr").value||nowParts().hora,pontos,resumo:resumo(pontos),salvoEm:new Date().toISOString()});
    clearTimeout(saveTimer);saveTimer=setTimeout(persist,500);
    status("busy","Salvando…");
    upsertLocal(atual);
  }
  function upsertLocal(rec){const i=records.findIndex(r=>r.id===rec.id);const c=JSON.parse(JSON.stringify(rec));if(i>=0)records[i]=c;else records.push(c);render()}
  function fechar(motivo){
    if(!atual)return;
    clearTimeout(saveTimer);
    atual.fechado=true;atual.fechadoEm=new Date().toISOString();
    persist();
    const h=atual.hora;atual=null;
    try{localStorage.removeItem(KEY_ATUAL)}catch(e){}
    ["dt","hr"].forEach(id=>delete $(id).dataset.touched);
    clearForm();
    msg($("msg"),"Medição das "+h+" salva"+(motivo?" ("+motivo+")":"")+". Pode começar a próxima.","ok");
  }
  // volta para a medição em andamento depois de recarregar a página
  function resume(){
    let cand=null;
    try{cand=JSON.parse(localStorage.getItem(KEY_ATUAL)||"null")}catch(e){}
    if(cand&&valid(cand)){
      const fresh=records.find(r=>r.id===cand.id);
      if(fresh&&fresh.fechado)cand=null;
    }
    if(!cand||!valid(cand)||cand.fechado)return;
    const parado=Date.now()-Date.parse(cand.salvoEm||0);
    atual=cand;
    if(parado>FECHA_PARADO_MS){fechar("parada há mais de 30 minutos");return}
    fillForm(atual);lastInput=Date.now()-parado;
    upsertLocal(atual);persist();
    msg($("msg"),"Voltei para a medição das "+atual.hora+", que ainda estava em andamento.","ok");
  }
  setInterval(()=>{
    if(!atual)return;
    const parado=Date.now()-lastInput;
    if(parado>=FECHA_PARADO_MS)fechar("salva sozinha após 30 minutos parada");
  },1000);
  setInterval(()=>{if(!atual&&$("dt").dataset.touched!=="1"&&$("hr").dataset.touched!=="1")setNow()},15000);
  document.getElementById("groups").addEventListener("input",e=>{if(!e.target.readOnly)onEdit()});
  ["dt","hr"].forEach(id=>$(id).addEventListener("input",()=>{$(id).dataset.touched="1";if(atual)onEdit()}));
  $("form").addEventListener("submit",e=>e.preventDefault());
  $("save").addEventListener("click",()=>{
    if(!atual){                      // salva mesmo sem nada digitado
      const n=nowParts(),pontos=readForm();
      atual={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),criadoEm:new Date().toISOString(),fechado:false,
        data:$("dt").value||n.data,hora:$("hr").value||n.hora,pontos,resumo:resumo(pontos),salvoEm:new Date().toISOString()};
      upsertLocal(atual);
    }
    fechar();
  });
  window.addEventListener("pagehide",()=>{if(atual){clearTimeout(saveTimer);persist()}});
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&atual){clearTimeout(saveTimer);persist()}});

  /* ---------- lista ---------- */
  function recTable(pontos){
    const t=el("table");
    t.appendChild(el("thead",{},[el("tr",{},[el("th",{textContent:"Ponto"})].concat(CAMPOS.map(c=>el("th",{textContent:c.t}))))]));
    const tb=el("tbody");let last="";
    for(const p of PONTOS){
      const v=pontos[p.id],lado=p.lado.replace(", ao fundo","");
      tb.appendChild(el("tr",{className:p.lado!==last&&last?"sep":""},[el("td",{textContent:p.nome==="—"?lado:lado.replace("Lado e","E").replace("Lado d","D")+" "+p.nome})]
        .concat(CAMPOS.map(c=>el("td",{textContent:fmt(v[c.k])})))));
      last=p.lado;
    }
    const s=resumo(pontos);
    [["Média do lado esquerdo",s.esquerdo],["Média do lado direito",s.direito],["Média do meio",s.meio],["Média geral (das 3 médias)",s.geral]].forEach(([t2,v],i)=>
      tb.appendChild(el("tr",{className:"tot"+(i===0?" sep":"")},[el("td",{textContent:t2,colSpan:3}),el("td",{textContent:fmt(v)})])));
    t.appendChild(tb);return t;
  }
  function render(){
    records.sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
    if(!records.length) emptyList("Nenhuma medição ainda. Digite os valores acima: tudo é salvo sozinho.");
    else{
      const list=$("list");list.textContent="";
      for(const r of records){
        const tag=r.legado?" · versão antiga, 1 valor por ponto (na coluna Média)":(r.fechado===false?" · em andamento":"");
        const act=el("div",{className:"act"}),note=el("p",{className:"msg"});
        const showButtons=()=>{act.textContent="";
          const bp=el("button",{type:"button",className:"btn ghost sm",textContent:"PDF"});bp.setAttribute("aria-label","Exportar PDF do registro de "+fmtDate(r.data)+" às "+r.hora);
          const ba=el("button",{type:"button",className:"btn danger sm",textContent:"Apagar"});ba.setAttribute("aria-label","Apagar o registro de "+fmtDate(r.data)+" às "+r.hora);
          bp.onclick=()=>exportRecord(r,note);ba.onclick=showConfirm;act.append(bp,ba)};
        const showConfirm=()=>{act.textContent="";
          const yes=el("button",{type:"button",className:"btn dangerfill sm",textContent:"Sim, apagar"}),no=el("button",{type:"button",className:"btn ghost sm",textContent:"Cancelar"});
          yes.onclick=()=>apagar(r,note,yes);no.onclick=showButtons;act.append(el("span",{textContent:"Apagar este registro?"}),yes,no);no.focus()};
        showButtons();
        list.appendChild(el("div",{className:"rec"},[
          el("div",{className:"rechead"},[el("h4",{},[document.createTextNode(fmtDate(r.data)+" "),el("span",{textContent:"às "+r.hora+tag})]),act]),
          recTable(r.pontos),note]));
      }
    }
    $("count").textContent=records.length?records.length+(records.length===1?" registro":" registros"):"";
    const sel=$("mes"),cur=sel.value,months=[...new Set(records.map(r=>r.data.slice(0,7)))].sort().reverse();
    sel.innerHTML='<option value="">Todos os registros</option>';
    for(const m of months){const o=document.createElement("option");o.value=m;o.textContent=MESES[+m.slice(5)-1]+" de "+m.slice(0,4);sel.appendChild(o)}
    if(months.includes(cur))sel.value=cur;
  }

  /* ---------- PDF ---------- */
  function buildPdf(list,periodo){
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
    const W=210,L=18,R=W-18;let y=20;const gerado=new Date();
    const X=[L+3,L+92,L+122,R-3];
    const ROW=6.2,BLOCK=10+ROW+(PONTOS.length+4)*ROW+10;
    function head(){
      doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(0);doc.text("Medições de decibéis – Salão de Assembleia",L,y);y+=7;
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);
      doc.text("Período: "+periodo+"   ·   Gerado em "+gerado.toLocaleDateString("pt-BR")+" às "+gerado.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),L,y);y+=5;
      doc.text("Valores em dB. Mínima e máxima conforme anotadas; médias calculadas pelo app.",L,y);y+=10;doc.setTextColor(0);
    }
    head();
    const asc=list.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    for(const r of asc){
      if(y+BLOCK>282){doc.addPage();y=20;head()}
      doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(fmtDate(r.data)+"  às "+r.hora,L,y);
      const nota=r.legado?"versão antiga do app: 1 valor por ponto, mostrado na coluna Média":(r.fechado===false?"medição em andamento":"");
      if(nota){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);doc.text(nota,L+48,y);doc.setTextColor(0);doc.setFont("helvetica","bold")}
      y+=4;
      doc.setFillColor(232,240,254);doc.rect(L,y,R-L,ROW+0.5,"F");y+=4.4;
      doc.setFontSize(9.5);doc.text("Ponto",X[0],y);CAMPOS.forEach((c,i)=>doc.text(c.t,X[i+1],y,{align:"right"}));
      y+=ROW;doc.setFont("helvetica","normal");doc.setFontSize(10);
      let last="";
      for(const p of PONTOS){
        if(last&&p.lado!==last){doc.setDrawColor(200,210,228);doc.line(L,y-4.3,R,y-4.3)}
        last=p.lado;
        doc.text(p.nome==="—"?"Meio, ao fundo":p.lado+" – "+p.nome+" medição",X[0],y);
        CAMPOS.forEach((c,i)=>doc.text(fmt(r.pontos[p.id][c.k]),X[i+1],y,{align:"right"}));
        y+=ROW;
      }
      const s=resumo(r.pontos);
      doc.setDrawColor(21,86,214);doc.line(L,y-4.3,R,y-4.3);doc.setFont("helvetica","bold");
      [["Média do lado esquerdo",s.esquerdo],["Média do lado direito",s.direito],["Média do meio, ao fundo",s.meio],["Média geral (média das 3 médias acima)",s.geral]].forEach(([t,v])=>{
        doc.text(t,X[0],y);doc.text(fmt(v),X[3],y,{align:"right"});y+=ROW});
      doc.setFont("helvetica","normal");
      doc.setDrawColor(21,86,214);doc.line(L,y-3.6,R,y-3.6);y+=6;
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text("Total: "+asc.length+" registro(s)   ·   Página "+i+" de "+n,L,290)}
    return doc.output("blob");
  }

  async function baixar(blob,filename,out){
    if(INSIDE_CLAUDE){
      const dl=await window.claude.use("downloads");
      if(!dl) return msg(out,"Esta visualização não permite baixar arquivos. Abra a página no claude.ai.","err");
      try{await dl.save({filename,data:blob});msg(out,"PDF salvo.","ok")}
      catch(err){msg(out,err&&err.code==="declined"?"Download cancelado.":"Não foi possível salvar o PDF.","err")}
    }else{
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      msg(out,"PDF gerado.","ok");
    }
  }
  async function exportRecord(r,out){
    if(!window.jspdf) return msg(out,"O gerador de PDF não carregou. Recarregue a página.","err");
    let blob;try{blob=buildPdf([r],"registro de "+fmtDate(r.data)+" às "+r.hora)}catch(e){return msg(out,"Não foi possível gerar o PDF.","err")}
    await baixar(blob,"decibeis-salao-"+r.data+"-"+String(r.hora).replace(":","h")+".pdf",out);
  }
  async function apagar(r,out,btn){
    btn.disabled=true;
    try{
      if(atual&&atual.id===r.id){clearTimeout(saveTimer);atual=null;try{localStorage.removeItem(KEY_ATUAL)}catch(e){};clearForm()}
      await saving.catch(()=>{});
      await store.remove(r);
      if(!r.legado)reserva.put(Object.assign(JSON.parse(JSON.stringify(r)),{apagado:true,apagadoEm:new Date().toISOString()}));
      records=records.filter(x=>x.id!==r.id);render();
      msg($("msg"),"Registro de "+fmtDate(r.data)+" às "+r.hora+" apagado.","ok");
    }catch(e){btn.disabled=false;msg(out,"Não foi possível apagar. Verifique a conexão e tente de novo.","err")}
  }
  $("pdf").addEventListener("click",async()=>{
    if(atual){clearTimeout(saveTimer);persist()}
    const m=$("mes").value,list=m?records.filter(r=>r.data.startsWith(m)):records;
    if(!list.length) return msg($("pdfmsg"),"Não há registros para exportar.","err");
    if(!window.jspdf) return msg($("pdfmsg"),"O gerador de PDF não carregou. Recarregue a página.","err");
    const periodo=m?MESES[+m.slice(5)-1]+" de "+m.slice(0,4):"todos os registros";
    const filename="decibeis-salao-"+(m||"todos")+".pdf";
    let blob;
    try{blob=buildPdf(list,periodo)}catch(e){return msg($("pdfmsg"),"Não foi possível gerar o PDF.","err")}
    await baixar(blob,filename,$("pdfmsg"));
  });

  /* ---------- início ---------- */
  setNow();
  (async()=>{
    if(INSIDE_CLAUDE){
      const db=await window.claude.use("db");
      if(db){store=claudeStore(db);$("where").textContent="Salvo na sua conta Claude, com uma cópia de reserva neste aparelho.";store.start();return}
      store=localStore;$("where").textContent="Sem conexão com a conta Claude: salvando neste aparelho, com cópia de reserva.";store.start();return;
    }
    store=localStore;
    $("where").textContent="Salvo neste aparelho e navegador, com uma cópia de reserva separada. Exporte o PDF de vez em quando como cópia extra.";
    store.start();
  })();
})();
</script>
</body>
